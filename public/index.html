<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dartsclub Lentjheuvel</title>
<meta name="theme-color" content="#0c1511">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dartsclub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
.gate{max-width:460px;margin:0 auto;padding:12vh max(20px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:18px}
.gate p{margin:0;font-size:1.1rem}
.gate-form{display:flex;flex-direction:column;gap:14px}
.gate-code{font-size:1.6rem;letter-spacing:.2em;text-align:center}
.gate-err{color:var(--warn);font-weight:700}
.gate .btn{min-height:56px;font-size:1.1rem}
/* Layout: kroegscorebord — donker bordgroen, krijtwit, rood (thuis) / groen (gast), messing voor wie aan de beurt is. Bewust enkel donker thema: leesbaar vanaf de oche. */
:root{
  --bg:#0c1511;
  --panel:#13201a;
  --panel-2:#1a2b22;
  --line:#2a3d33;
  --chalk:#f2ecda;
  --muted:#9db0a3;
  --red:#e2483b;
  --green:#3fb06d;
  --brass:#e6b445;
  --brass-soft:#3a2f14;
  --warn:#f07a5a;
  --paper:#f4f1e8;
  --ink:#121212;
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-body:"Archivo","Segoe UI",Roboto,system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#app{height:100%}

/* ---------- algemene pagina's ---------- */
.page{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:900;font-size:2.4rem;line-height:1;text-transform:uppercase;margin:0}
.brand b{color:var(--red)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--green)}
.pill.fout i,.pill.ro i{background:var(--warn)}
.pill.lokaal i{background:var(--brass)}
h2.sec{font-family:var(--font-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2.sec small{font-family:var(--font-body);font-size:.85rem;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.section{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:1.15rem;font-weight:700}
.meta{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1c1606}
.btn.danger{color:var(--warn);border-color:#5a2a22;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty strong{color:var(--chalk)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:5px;font-size:.72rem;font-weight:700;letter-spacing:.04em;background:var(--brass-soft);color:var(--brass)}
.badge.vc{background:var(--panel-2);color:var(--chalk)}
.score-big{font-family:var(--font-display);font-weight:900;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.vs{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.c0{color:var(--red)} .c1{color:var(--green)}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
input.in[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block}
.srow>*,.prow>*{min-width:0}
input.in,select.in{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;font-size:1rem;width:100%;color:var(--chalk)}
input.in:focus,select.in:focus{border-color:var(--brass);outline:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 100px 170px 44px;gap:8px;align-items:center}
.srow{display:grid;grid-template-columns:minmax(150px,170px) 112px 64px 100px minmax(0,1.2fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.x{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:1.3rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 16px;font-weight:600;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brass);color:#1c1606}

/* speelavond */
.tot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.tot .side{display:flex;flex-direction:column;min-width:0}
.tot .side span:first-child{font-size:.85rem;color:var(--muted);font-weight:600}
.tot .side .big{font-family:var(--font-display);font-weight:900;font-size:4rem;line-height:.9;font-variant-numeric:tabular-nums}
.legtot{display:flex;flex-direction:column;padding-left:18px;border-left:1px solid var(--line)}
.legtot b{font-family:var(--font-display);font-weight:900;font-size:2.6rem;line-height:.95;font-variant-numeric:tabular-nums}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.og{display:grid;grid-template-columns:56px minmax(0,1fr) auto 150px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.og .num{font-family:var(--font-display);font-weight:900;font-size:2rem;text-align:center;color:var(--muted);line-height:1}
.og .what{font-weight:700;font-size:1.1rem}
.og .what small{display:block;font-weight:500;color:var(--muted);font-size:.85rem}
.og .res{font-family:var(--font-display);font-weight:900;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.og .res small{display:block;font-family:var(--font-body);font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.og.next{border-color:var(--brass);background:var(--brass-soft)}
.og.won0{border-left:5px solid var(--red)}
.og.won1{border-left:5px solid var(--green)}
.og .go{display:flex;justify-content:flex-end}
.card.click{cursor:pointer}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-height:76px}
.titem:hover{border-color:var(--muted);border-left-color:var(--red)}
.titem .tn b{display:block;font-family:var(--font-display);font-weight:900;font-size:1.9rem;line-height:1;text-transform:uppercase}
.titem small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.titem .tx{font-weight:600;min-width:0}
.titem .tx small{text-transform:uppercase;letter-spacing:.05em;font-size:.7rem}
.titem .tr{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:nowrap}
.chev{font-size:2rem;color:var(--muted);line-height:1}
.livechip{display:inline-flex;align-items:center;gap:8px;background:var(--brass-soft);border:1px solid var(--brass);color:var(--brass);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.livechip i{width:8px;height:8px;border-radius:50%;background:var(--brass)}
.livechip b{font-family:var(--font-display);font-size:1.2rem;color:var(--chalk)}
.startbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.startbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 18px;border-radius:12px;border:2px solid var(--brass);background:var(--brass);color:#1c1606;text-align:left;min-height:76px}
.startbtn b{font-family:var(--font-display);font-weight:900;font-size:1.6rem;text-transform:uppercase;line-height:1}
.startbtn span{font-size:.85rem;font-weight:600;opacity:.8}
.startbtn.beker{background:transparent;color:var(--brass)}
.qbtn{width:40px;padding:0;font-size:1.3rem;font-weight:900;border-color:var(--brass);color:var(--brass);background:transparent}
.guidecard{text-align:left;cursor:pointer;min-height:150px}
.guidecard .gstart{margin-top:auto;color:var(--brass);font-weight:700}
.dialog.guide{max-width:640px;text-align:left;gap:12px}
.dialog.guide h3{font-size:2rem}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-dots{display:flex;gap:6px}
.g-dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.g-dots i.on{background:var(--brass)} .g-dots i.done{background:var(--muted)}
.g-p{margin:0;font-size:1.15rem;line-height:1.5}
.g-nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.g-nav .btn{min-height:54px;font-size:1.05rem;flex:1}
.g-ill{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:center;align-items:center;min-height:150px;overflow:hidden}
.gmk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--brass);color:#1c1606;font-weight:900;font-size:.9rem;font-family:var(--font-body);flex:none;box-shadow:0 0 0 3px var(--bg)}
.gx-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.gx-side{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gx-side.on{border-color:var(--brass)}
.gx-side b{font-family:var(--font-display);font-weight:900;font-size:3.4rem;line-height:.9}
.gx-side>.gmk:first-child{position:absolute;top:-10px;left:-10px}
.gx-name{font-weight:700;display:flex;gap:6px;align-items:center}
.gx-beg{font-style:normal;font-size:.65rem;background:var(--chalk);color:#111;border-radius:4px;padding:1px 5px;font-weight:800;text-transform:uppercase}
.gx-pips{display:flex;gap:6px;align-items:center}
.gx-pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)} .gx-pips i.w{background:var(--chalk);border-color:var(--chalk)}
.gx-pad{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;width:100%;max-width:420px}
.gx-hot,.gx-keys{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gx-hot>.gmk,.gx-keys>.gmk{position:absolute;top:-12px;left:-12px}
.gx-hot span,.gx-keys span{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;text-align:center;font-family:var(--font-display);font-weight:900;font-size:1.1rem;padding:6px 0}
.gx-hot span{color:var(--brass)}
.gx-keys span.ok{background:var(--brass);color:#1c1606}
.gx-col{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.gx-chips{display:flex;gap:6px;align-items:center}
.gx-chips span{flex:1;height:46px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:1.6rem}
.gx-chips span.ed{outline:3px solid var(--brass)} .gx-chips span.e{background:transparent;border-style:dashed}
.gx-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gx-acts span{border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.gx-acts .uit{border-color:var(--brass);color:var(--brass)} .gx-acts .dood{border-color:var(--warn);color:var(--warn)}
.gx-tac{background:#000;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;width:100%;max-width:420px}
.gx-trow{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px;height:48px}
.gx-trow:has(.gx-min){grid-template-columns:44px 1fr 64px}
.gx-c{background:#0b0b0b;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;color:#ff6a5c;container-type:size}
.gx-trow .gx-c:last-child{color:#57d68a}
.gx-c em{font-style:normal;color:var(--brass);font-weight:800}
.gx-c .mk{height:30px;gap:24px}.gx-c .mk .kx{width:24px;height:30px}.gx-c .mk .ln{height:4px}
.gx-n{background:var(--paper);color:var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:1.7rem}
.gx-min{border:1px solid #2a2a2a;background:#111;border-radius:6px;color:#bbb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem}
.gx-score{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 12px;align-self:center}
.gx-score b{font-family:var(--font-display);font-weight:900;font-size:2.4rem;line-height:1}
.gx-banner{background:var(--brass-soft);border:2px solid var(--brass);border-radius:10px;padding:10px 12px;font-weight:700;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gx-banner span{background:var(--brass);color:#1c1606;border-radius:8px;padding:8px 12px}
.gx-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.gx-list span{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:700}
.gx-list span i{margin-left:auto;font-style:normal;color:var(--muted)}
.gx-list span.on{border-color:var(--brass);background:var(--brass-soft)} .gx-list span.done{border-left:4px solid var(--red)}
.gx-start{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}
.gx-start span{border:2px solid var(--brass);background:var(--brass);color:#1c1606;border-radius:10px;padding:12px;font-family:var(--font-display);font-weight:900;font-size:1.3rem;text-transform:uppercase}
.gx-start span.b{background:transparent;color:var(--brass)}
.gx-start small{display:block;font-family:var(--font-body);font-size:.75rem;text-transform:none}
.gx-tot{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.gx-tot>b{font-family:var(--font-display);font-weight:900;font-size:3rem;line-height:1}
.gx-tot span{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:12px;margin-left:6px;color:var(--muted);font-weight:700}
.gx-tot span b{font-family:var(--font-display);font-size:1.8rem;color:var(--chalk)}
.solostats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.solostats span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.solostats small{color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.solostats b{font-family:var(--font-display);font-weight:900;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.solostats i{font-style:normal;font-family:var(--font-body);font-size:.9rem;color:var(--muted);font-weight:600}
.solostats.col{grid-template-columns:1fr;padding:12px;flex:1;align-content:space-evenly}
.solostats.col b{font-size:clamp(2rem,6vmin,4rem)}
.sideP.solo{border-style:dashed}
.tcell.off{background:transparent;box-shadow:none}
.tscore.round{border-color:var(--brass)}
.tscore.round .h{background:var(--brass);color:#1c1606}
.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.botable{min-width:420px}.botable td{vertical-align:middle}.botable select.in{min-height:42px}
.chip.a0{border:2px solid var(--chalk);background:#2a4034;box-shadow:0 0 0 2px rgba(242,236,218,.15)}
.chip.a1{opacity:.85}.chip.a2{opacity:.7}.chip.a3{opacity:.58}.chip.a4{opacity:.46}
.chip.a0.out{border-color:var(--brass)}
.pl .nm .newest{color:var(--chalk);font-weight:800}
.toggle{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.toggle input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--brass);flex:none}
.toggle span{display:flex;flex-direction:column;gap:2px;min-width:0}
.toggle small{color:var(--muted);font-size:.85rem}
.seasonline{display:flex;flex-wrap:wrap;gap:6px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:.95rem;color:var(--muted)}
.seasonline b{color:var(--chalk);font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.seasonline .sw b{color:var(--green)} .seasonline .sl b{color:var(--red)}
.dialog.resdlg{text-align:left}
.resnum::placeholder{color:var(--line)}
.resgrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px 10px;align-items:center}
.resgrid>span{font-weight:700;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resgrid .rl{color:var(--muted)}
.resgrid .dash{font-family:var(--font-display);font-weight:900;font-size:1.6rem;color:var(--muted)}
.resnum{font-family:var(--font-display)!important;font-weight:900;font-size:2rem!important;text-align:center;min-height:58px!important}
.stable td.rs{white-space:nowrap;text-align:right}
.rslink{border:0;background:transparent;padding:4px 6px;font-family:var(--font-display);font-weight:900;font-size:1.25rem;color:var(--chalk);cursor:pointer}
.stable tr.band td.rs .rslink{color:inherit}
.updbanner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--brass-soft);border:2px solid var(--brass);border-radius:var(--r);padding:12px 16px;cursor:pointer}
.updbanner span:first-child{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.updbanner small{color:var(--muted);font-size:.85rem}
.updgo{background:var(--brass);color:#1c1606;font-weight:800;border-radius:8px;padding:10px 16px;flex:none}
.drow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.drow .dn{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.drow .dn small{color:var(--muted);font-size:.82rem}
.drow .dt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drow .btn{min-height:40px;padding:6px 12px;font-size:.9rem}
.hls{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.hl{font-size:.75rem;font-weight:800;padding:2px 7px;border-radius:5px;border:1px solid currentColor;letter-spacing:.02em}
.hlsum{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.hlsum b{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.hlsum small{color:var(--muted)}
.live{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px}
.lcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lc-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;font-weight:800;font-size:1.15rem}
.lc-head span:last-child{text-align:right}
.lc-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-score{font-family:var(--font-display);font-weight:900;font-size:2.6rem;line-height:1;text-align:center}
.lc-score small{display:block;font-family:var(--font-body);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lc-meta,.lc-game,.lc-sub{color:var(--muted);font-size:.9rem;font-weight:600}
.lc-big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc-big b{font-family:var(--font-display);font-weight:900;font-size:clamp(3rem,9vw,6rem);line-height:.9;text-align:center;background:var(--bg);border-radius:10px;padding:8px 0}
.lc-head .turn{font-style:normal;color:var(--brass);margin:0 .35em;font-size:.9em}
.lc-big b.on{box-shadow:inset 0 0 0 3px var(--brass)}
.lc-none{color:var(--muted);font-weight:700;padding:16px 0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start}
.tab{border:0;background:transparent;border-radius:9px;padding:10px 22px;font-weight:700;font-size:1.05rem;min-height:48px;color:var(--muted)}
.tab.on{background:var(--chalk);color:#111}
.teamblock{display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--red);padding-top:14px}
.tb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-name{cursor:pointer;min-width:0}
.tb-name h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:2.2rem;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.tb-next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem}
.nlist{display:flex;flex-direction:column;gap:6px}
.nrow{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nrow:hover{border-color:var(--muted)}
.nrow.live{border-left:4px solid var(--brass)}
.nrow small{display:block;color:var(--muted);font-size:.8rem;font-weight:500}
.nd{font-weight:700;font-variant-numeric:tabular-nums}
.nop{font-weight:700;min-width:0;overflow-wrap:anywhere}
.nsc{text-align:right}
.nsc b{font-family:var(--font-display);font-weight:900;font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.pickcard{text-align:left;cursor:pointer}
.pickcard.on{border-color:var(--brass);background:var(--brass-soft)}
.prow.head span,.srow.head span{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input.in.nr{font-variant-numeric:tabular-nums;letter-spacing:.12em;text-align:center}
.lnr{font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:700;letter-spacing:.08em;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:none}
.roster .pn{min-width:0;overflow-wrap:anywhere}
.roster .badge{margin-left:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.stable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:560px}
.stable th{text-align:left;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.stable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.stable td.d{white-space:nowrap;font-weight:700}
.stable td.ad{color:var(--muted)}
.stable tr.band td{font-weight:700}
.stable tr.band.beker td{background:#14233a;color:#9cc0ff}
.stable tr.band.info td{background:#2a2414;color:#e8cf8a}
.stable tr.past{opacity:.45}
.stable tr.next td{box-shadow:inset 0 2px 0 var(--brass),inset 0 -2px 0 var(--brass)}
.card.click:hover{border-color:var(--muted)}
.card.hold{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.roster li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600;min-width:0}
.roster li .meta{margin-left:auto;font-weight:500}
.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sched li{display:grid;grid-template-columns:120px 80px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.sched li.past{opacity:.5}
.sched li.next{border-color:var(--brass);background:var(--brass-soft)}
.sched .d{font-weight:700}
.sched .ty{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sched .ty.beker{color:var(--brass)}
.sched .op{min-width:0;overflow-wrap:anywhere}
.started{font-size:clamp(.65rem,1.5vmin,.85rem);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--chalk);color:#111;flex:none}
.tstart{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:4px 8px;font-size:clamp(.7rem,1.6vmin,.9rem);font-weight:700;line-height:1.2;max-width:100%}
.tstart b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- scorebord: gedeeld ---------- */
.game{height:100%;display:grid;gap:8px;padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));overflow:hidden}
.gbar{grid-area:bar;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.gbar .title{font-family:var(--font-display);font-weight:800;font-size:1.35rem;text-transform:uppercase;letter-spacing:.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gbar .title small{font-family:var(--font-body);font-size:.8rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;margin-left:8px}
.gbar .btn{flex:none}
.legs{display:inline-flex;gap:6px;flex:none}
.legs i{width:clamp(12px,1.8vmin,20px);height:clamp(12px,1.8vmin,20px);border-radius:50%;border:2px solid var(--muted)}
.legs i.w{background:var(--chalk);border-color:var(--chalk)}

/* ---------- 501 / 701 ---------- */
.game.x01{grid-template-columns:minmax(0,1fr) minmax(0,.95fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "a pad b"}
.sideP{background:var(--panel);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.sideP.a{grid-area:a}.sideP.b{grid-area:b}
.sideP .stripe{height:8px;flex:none;background:var(--red)}
.sideP.b .stripe{background:var(--green)}
.sideP.on{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass) inset}
.side-head{display:flex;align-items:center;gap:12px;padding:12px 14px 2px;flex:none}
.side-head .lbl{font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,4.6vmin,2.6rem);line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;min-width:0;flex:1}
.side-head .started{font-size:clamp(.8rem,2vmin,1.1rem);padding:3px 9px}
.side-head .legs{gap:8px}
.side-head .legs i{width:clamp(16px,2.8vmin,28px);height:clamp(16px,2.8vmin,28px);border-width:3px}
.remwrap{flex:1 1 0;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.rem{font-family:var(--font-display);font-weight:900;line-height:.8;font-variant-numeric:tabular-nums;font-size:min(88cqh,58cqw);letter-spacing:-.01em}
.sideP.a .rem{color:#ffece7}
.players{list-style:none;margin:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;flex:none}
.pl{border-radius:10px;padding:6px 8px;background:var(--bg);border:2px solid transparent;display:flex;flex-direction:column;gap:4px;min-width:0}
.pl.on{border-color:var(--brass);background:var(--brass-soft)}
.pl .nm{font-weight:700;font-size:clamp(.85rem,1.8vmin,1.1rem);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.on .nm{color:var(--brass)}
.hist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip{height:clamp(56px,10.4vmin,108px);border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--font-display);font-weight:900;font-size:clamp(1.9rem,6.6vmin,4.3rem);font-variant-numeric:tabular-nums;line-height:1;padding:0;min-width:0}
.chip.empty{background:transparent;border-style:dashed;cursor:default}
.chip.bust{color:var(--warn)}
.chip{container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.chip .cv{display:block;line-height:.9;font-size:min(80cqh,118cqi)}
.chip .cv.d2{font-size:min(80cqh,82cqi)}
.chip .cv.d3{font-size:min(80cqh,58cqi)}
.chip.bust .cv{font-size:min(56cqh,58cqi)}
.chip.bust small{font-size:min(20cqh,22cqi);display:block;font-family:var(--font-body);font-weight:800;letter-spacing:.04em;line-height:1.1}
.chip.out{background:var(--brass);color:#1c1606;border-color:var(--brass)}
.chip.ed{outline:4px solid var(--brass);outline-offset:-2px}

.pad{grid-area:pad;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0;min-width:0}
.disp{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 14px;min-height:clamp(48px,8vmin,76px)}
.disp .lbl{font-size:.9rem;color:var(--muted);font-weight:700}
.disp .buf{font-family:var(--font-display);font-weight:900;font-size:clamp(2rem,6vmin,3.6rem);line-height:1;font-variant-numeric:tabular-nums}
.disp.edit{border-color:var(--brass);background:var(--brass-soft)}
.disp.edit .lbl{color:var(--brass)}
.kpads{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px;min-height:0;container-type:size}
.hot,.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;min-height:0}
.hot{grid-template-rows:repeat(3,minmax(0,1fr))}
.keys{grid-template-rows:repeat(4,minmax(0,1fr))}
.hot button,.keys button{border-radius:10px;border:1px solid var(--line);font-family:var(--font-display);font-weight:900;line-height:1;min-height:0;padding:0}
.hot button{background:var(--panel-2);font-size:clamp(1.2rem,min(13cqh,7cqw),3rem);color:var(--brass)}
.keys button{background:var(--panel);font-size:clamp(1.4rem,min(16cqh,8.5cqw),3.6rem)}
.keys button.ok{background:var(--brass);color:#1c1606;border-color:var(--brass)}
.keys button.bk{color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts button{min-height:clamp(46px,7.5vmin,70px);border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:800;font-size:clamp(.95rem,2.2vmin,1.3rem)}
.acts .outb{border-color:var(--brass);color:var(--brass)}
.acts .dood{border-color:var(--warn);color:var(--warn)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4}

/* ---------- Tac-tic: bordweergave ---------- */
.game.tac{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1.25fr) minmax(0,7fr) auto;grid-template-areas:"bar" "head" "board" "foot"}
.thead{grid-area:head;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-height:0}
.tscore{border-radius:12px;border:2px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0;overflow:hidden;padding:0}
.tscore .h{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:clamp(.9rem,2.2vmin,1.4rem);padding:4px 8px;color:#fff;white-space:nowrap;overflow:hidden}
.tscore.s0 .h{background:var(--red)} .tscore.s1 .h{background:var(--green)}
.tscore .h .tn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tscore .h .started{font-size:.75em}
.tscore .v{container-type:size;min-height:0;display:flex;align-items:center;justify-content:center}
.tscore .v b{font-family:var(--font-display);font-weight:900;font-size:min(92cqh,45cqw);line-height:.8;font-variant-numeric:tabular-nums}
.tscore .v small{font-size:min(16cqh,4.5cqw);color:var(--muted);font-weight:600;margin-left:.6em;align-self:flex-end;margin-bottom:.6em}
.tleg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:clamp(70px,12vmin,130px)}
.tleg .n{background:var(--paper);color:var(--ink);font-family:var(--font-display);font-weight:900;font-size:clamp(1.6rem,6vmin,3.6rem);line-height:1;padding:2px 14px;border-radius:8px}
.tleg .l{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tboard{grid-area:board;display:grid;grid-template-rows:repeat(12,minmax(0,1fr));gap:4px;min-height:0;background:#000;border-radius:12px;padding:6px}
.trow{display:grid;grid-template-columns:clamp(40px,7vmin,72px) minmax(0,1fr) clamp(64px,13vmin,140px) minmax(0,1fr) clamp(40px,7vmin,72px);gap:6px;min-height:0;container-type:size}
.tcell{border:0;border-radius:8px;background:#0b0b0b;display:flex;align-items:center;gap:6%;padding:0 4%;min-width:0;min-height:0}
.tcell.s0{justify-content:flex-end;box-shadow:inset 0 -2px 0 #2b1210}
.tcell.s1{justify-content:flex-start;box-shadow:inset 0 -2px 0 #102b1a}
.tcell:active{background:#1a1a1a}
.tcell .pts{font-family:var(--font-display);font-weight:800;font-size:52cqh;color:var(--brass);line-height:1}
.tnum{background:var(--paper);color:var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:min(82cqh,30cqw);line-height:1;min-height:0}
.trow.dead .tnum{background:#4a4a46;color:#1a1a1a;text-decoration:line-through}
.trow.dead .tcell{opacity:.55}
.tminus{border:1px solid #2a2a2a;background:#111;border-radius:8px;color:#bbb;font-size:min(60cqh,2rem);font-weight:700;line-height:1;padding:0;min-height:0}
.mk{position:relative;flex:none;display:inline-flex;align-items:center;gap:62cqh;height:76cqh}
.mk .kx{position:relative;display:block;width:62cqh;height:76cqh}
.mk .kx::before,.mk .kx::after{content:"";position:absolute;left:50%;top:50%;width:14%;height:100%;border-radius:3px;background:currentColor;transform:translate(-50%,-50%) rotate(35deg)}
.mk .kx::after{transform:translate(-50%,-50%) rotate(-35deg)}
.mk .ln{position:absolute;left:-8%;right:-8%;top:50%;height:11cqh;min-height:3px;border-radius:3px;background:currentColor;transform:translateY(-50%)}
.tcell.s0 .mk{color:#ff6a5c} .tcell.s1 .mk{color:#57d68a}
.tfoot{grid-area:foot;display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.tfoot .btn{min-height:52px;font-size:1rem}
.banner{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brass-soft);border:2px solid var(--brass);border-radius:10px;padding:6px 12px;font-weight:700;min-width:0}
.hint{flex:1;display:flex;align-items:center;color:var(--muted);font-size:.88rem;min-width:0}

/* overlays */
.cover{position:fixed;inset:0;background:rgba(6,10,8,.84);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.dialog{background:var(--panel);border:2px solid var(--brass);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.dialog h3{font-family:var(--font-display);font-weight:900;font-size:2.4rem;text-transform:uppercase;margin:0;line-height:1}
.dialog .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialog .choices button{min-height:96px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:1.2rem;padding:10px}
.dialog .choices .k0{border-color:var(--red)} .dialog .choices .k1{border-color:var(--green)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.numpad button{min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--font-display);font-weight:900;font-size:2rem}
.ptsops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ptsops button{min-height:56px;border-radius:10px;font-weight:800;font-size:1.05rem;border:1px solid var(--line);background:var(--panel-2)}
.ptsops .add{background:var(--brass);color:#1c1606;border-color:var(--brass)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:#111;padding:12px 18px;border-radius:10px;font-weight:700;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none}

/* staand scherm: scores naast elkaar boven, toetsen onder */
@media (orientation:portrait){
  .game.x01{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"bar bar" "a b" "pad pad"}
  .game.tac{grid-template-rows:auto minmax(0,1fr) minmax(0,7.5fr) auto}
}
@media (max-width:700px){
  .og{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"n w r" "n g g"}
  .og .num{grid-area:n}.og .what{grid-area:w}.og .res{grid-area:r}.og .go{grid-area:g;justify-content:stretch}.og .go .btn{flex:1}
  .srow{grid-template-columns:1fr 1fr 1fr 44px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .srow.head{display:none}
  .srow>:nth-child(5),.srow>:nth-child(6){grid-column:1 / span 3}
  .titem{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n r" "x r"}
  .titem .tn{grid-area:n}.titem .tx{grid-area:x}.titem .tr{grid-area:r}
  .nrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"o s" "d s"}
  .nrow .nd{grid-area:d}.nrow .nop{grid-area:o}.nrow .nsc{grid-area:s}
  .gbar .title small{display:none}
  .gbar .hide-sm{display:none}
}
.sched li{} @media (max-width:520px){.prow{grid-template-columns:minmax(0,1fr) 72px 110px 44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app"></div>

function thrower(g,l,i){if(g.solo)return {side:0,pi:0};return {side:(l.starter+i)%2,pi:g.size===2?Math.floor(i/2)%2:0}}
function x01State(g,l){
  const start=g.kind==='701'?701:501,rem=[start,start],entries=[];let winner=null,endIndex=-1;
  for(let i=0;i<l.turns.length;i++){
    const s=l.turns[i],{side,pi}=thrower(g,l,i),before=rem[side];
    let eff=s,bust=false,out=false;
    if(s===DOOD){eff=0;bust=true}
    else{const r=before-s;if(r<0||r===1){eff=0;bust=true}else if(r===0)out=true}
    rem[side]=before-eff;
    entries.push({i,side,pi,s,eff,bust,out,before});
    if(out){winner=side;endIndex=i;break}
  }
  return {rem,entries,winner,endIndex,next:thrower(g,l,entries.length)};
}
const BO_DEFAULT={'Hoofdklasse':{'501':7,'701':7,tactic:3},'1e divisie':{'501':7,'701':7,tactic:3},'2e divisie':{'501':5,'701':5,tactic:3},'3e divisie':{'501':3,'701':3,tactic:3},'4e divisie':{'501':3,'701':3,tactic:3}};
function boFor(div,kind){const c=S.settings&&S.settings.bo&&S.settings.bo[div];if(c&&c[kind])return +c[kind];const d=BO_DEFAULT[div]||BO_DEFAULT['4e divisie'];return d[kind]||3}
const need=g=>g.solo?(g.bestOf||3):Math.ceil((g.bestOf||3)/2);
const legWinner=(g,l)=>g.kind==='tactic'?(l.winner===0||l.winner===1?l.winner:null):x01State(g,l).winner;
function legsWon(g){const w=[0,0];g.legs.forEach(l=>{const s=legWinner(g,l);if(s!==null)w[s]++});return w}
function gameStarted(g){
  if(g.winner===0||g.winner===1)return true;
  if(g.kind!=='tactic')return g.legs.length>0;
  return g.legs.length>1||g.legs.some(l=>l.pts[0]||l.pts[1]||TARGETS.some(t=>l.marks[0][t]||l.marks[1][t]));
}
function normalizeX01(g){
  if(!g.legs.length){g.winner=null;return null}
  const cur=g.legs[g.legs.length-1],st=x01State(g,cur);
  if(st.winner!==null){
    if(cur.turns.length>st.endIndex+1)cur.turns=cur.turns.slice(0,st.endIndex+1);
    const w=legsWon(g);
    if(w[st.winner]>=need(g)){g.winner=st.winner;return {game:st.winner}}
    g.legs.push({starter:1-cur.starter,turns:[]});g.winner=null;return {leg:st.winner};
  }
  g.winner=null;return null;
}

function validX01(s,before){

}

function newTacLeg(st){const mk=()=>{const o={};TARGETS.forEach(t=>o[t]=0);return o};return {marks:[mk(),mk()],pts:[0,0],winner:null,starter:st||0}}
const closedAll=m=>TARGETS.every(t=>(m[t]||0)>=3);
function tacVerdict(l){
  const a=closedAll(l.marks[0]),b=closedAll(l.marks[1]);
  if(a&&b&&l.pts[0]===l.pts[1])return {replay:true};
  if(a&&l.pts[0]>l.pts[1])return {win:0};
  if(b&&l.pts[1]>l.pts[0])return {win:1};

}

let lastVersionCheck=0;
async function checkVersion(force){
  if(APP_VERSION.startsWith('__'))return;
  if(!force&&Date.now()-lastVersionCheck<60000)return;
  lastVersionCheck=Date.now();
  try{
    const r=await fetch('version.json',{cache:'no-store'});if(!r.ok)return;
    const j=await r.json();const nv=!!(j&&j.v&&j.v!==APP_VERSION);
    if(nv!==!!S.newVersion){S.newVersion=nv;if(S.route&&S.route.name==='home')render()}
  }catch(e){}
}

  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
  location.reload();
}

function nightForSched(t,s){return Object.values(S.matches).find(m=>m.kind==='avond'&&m.teamId===t.id&&(m.schedId===s.id||(!m.schedId&&m.date===s.date)))}
function seasonLine(done){
  if(!done.length)return '';
  let w=0,d=0,l=0,lf=0,la=0;
  done.forEach(m=>{const s=matchScore(m),lt=legTotal(m);lf+=lt[0];la+=lt[1];if(s[0]>s[1])w++;else if(s[0]<s[1])l++;else d++});
  return '<div class="seasonline"><span><b>'+done.length+'</b> gespeeld</span><span class="sw"><b>'+w+'</b> gewonnen</span><span><b>'+d+'</b> gelijk</span><span class="sl"><b>'+l+'</b> verloren</span><span>legs <b>'+lf+'–'+la+'</b></span></div>';
}

function newNight(t,st){

/* ---------- 180's en high finishes per partij ---------- */
function hfMin(){return (S.settings&&+S.settings.hf)||100}
function highlights(g){
  const r={c180:[0,0],hf:[]};
  if(!g||g.kind==='tactic'||!g.legs)return r;
  g.legs.forEach(l=>{if(!l.turns)return;x01State(g,l).entries.forEach(e=>{
    if(e.s===180&&!e.bust)r.c180[e.side]++;
    if(e.out&&e.s>=hfMin())r.hf.push({side:e.side,v:e.s});
  })});
  return r;
}
function hlChips(g){
  const h=highlights(g);let out='';
  [0,1].forEach(s=>{if(h.c180[s])out+='<span class="hl c'+s+'">180'+(h.c180[s]>1?' ×'+h.c180[s]:'')+'</span>'});
  h.hf.forEach(x=>{out+='<span class="hl c'+x.side+'">HF '+x.v+'</span>'});
  return out?'<span class="hls">'+out+'</span>':'';
}
function hlSummary(m){
  const t180=[0,0],hfs=[];
  m.games.forEach(g=>{const h=highlights(g);t180[0]+=h.c180[0];t180[1]+=h.c180[1];h.hf.forEach(x=>hfs.push({...x,n:g.n}))});
  if(!t180[0]&&!t180[1]&&!hfs.length)return '';
  const g0=m.games[0];
  let h='<div class="hlsum"><span><b>180\'s</b> <span class="c0">'+esc(sideLabel(m,g0,0))+' '+t180[0]+'</span> · <span class="c1">'+esc(sideLabel(m,g0,1))+' '+t180[1]+'</span></span>';
  if(hfs.length)h+='<span><b>High finishes</b> '+hfs.map(x=>'<span class="c'+x.side+'">'+x.v+'</span> <small>(partij '+x.n+')</small>').join(', ')+'</span>';
  return h+'<span class="meta">Geheugensteun voor het wedstrijdformulier · HF vanaf '+hfMin()+'</span></div>';
}

function editNightDialog(){
  const e=S.ui.editNight;if(!e)return '';
  return '<div class="cover"><div class="dialog resdlg"><h3>Gegevens aanpassen</h3>'+

/* ---------- live-weergave (alleen beheer-apparaten) ---------- */
function liveCard(m){
  const w=matchScore(m),lt=legTotal(m);
  const cur=m.games.find(g=>g.winner==null&&gameStarted(g))||m.games.find(g=>g.winner==null);
  let body='<div class="lc-none">Alle partijen gespeeld</div>',turn=-1;

    const lw=legsWon(cur),g0=sideLabel(m,cur,0),g1=sideLabel(m,cur,1);
    let v0='–',v1='–',sub='';

    else{const st=x01State(cur,cur.legs[cur.legs.length-1]);v0=st.rem[0];v1=st.rem[1];sub='rest';turn=st.next.side}

    '<div class="lc-meta">'+(m.type==='Beker'?'Beker':m.round?'SpR '+esc(m.round):'Competitie')+' · tussenstand '+w[0]+'–'+w[1]+'</div>'+body+hlSummary(m)+'</div>';
}
function vLive(){
  if(!S.isAdmin)return '<div class="page"><div class="empty"><strong>Alleen op beheer-apparaten</strong><span>De live-weergave is (nog) niet voor iedereen beschikbaar.</span><button class="btn" data-go="">Naar overzicht</button></div></div>';

function getMatch(id){return S.matches[id]||S.archived[id]||(S.ui.losCache&&S.ui.losCache.id===id?S.ui.losCache:null)}

  const m=getMatch(id);if(!m)return notFound();const g=m.games.find(x=>x.n===n);if(!g)return notFound();

function starterDialog(m,g){

function soloStats(g){
  if(g.kind==='tactic'){const rs=g.legs.filter(l=>l.winner===0).map(l=>l.rounds||0);const marks=g.legs.reduce((a,l)=>a+TARGETS.reduce((b,t)=>b+(l.marks[0][t]||0),0),0),rounds=g.legs.reduce((a,l)=>a+(l.rounds||0),0);
    return {legs:rs.length,best:rs.length?Math.min(...rs):null,unit:'beurten',avg:rounds?marks/rounds:null,avgLbl:'Kruisjes per beurt',cur:(g.legs[g.legs.length-1]||{}).rounds||0}}

/* ----- 501/701 ----- */
function vX01(m,g){
  const l=g.legs.length?g.legs[g.legs.length-1]:{starter:0,turns:[]},st=x01State(g,l),w=legsWon(g);

  let h='<div class="game x01">'+gameBar(m,g,swap);
  [0,1].forEach(side=>{
    const on=!over&&nx.side===side;
    if(g.solo&&side===1){const ss=soloStats(g);
      h+='<section class="sideP b solo"><div class="stripe"></div><div class="side-head"><span class="lbl">Oefenen</span></div><div class="solostats col">'+
        '<span><small>Leg</small><b>'+Math.max(1,g.legs.length)+' <i>van '+need(g)+'</i></b></span>'+
        '<span><small>Pijlen deze leg</small><b>'+ss.cur*3+'</b></span>'+
        '<span><small>'+ss.avgLbl+'</small><b>'+(ss.avg!=null?ss.avg.toFixed(1):'–')+'</b></span>'+
        '<span><small>Beste leg</small><b>'+(ss.best!=null?ss.best+' <i>pijlen</i>':'–')+'</b></span></div></section>';
      return;
    }
    h+='<section class="sideP '+(side?'b':'a')+(on?' on':'')+'"><div class="stripe"></div><div class="side-head"><span class="lbl fit c'+side+'">'+esc(sideLabel(m,g,side))+'</span>'+(!g.solo&&l.starter===side?'<span class="started">Begon</span>':'')+legPips(w[side],g)+'</div>'+
      '<div class="remwrap"><span class="rem">'+st.rem[side]+'</span></div><ul class="players">';
    { /* één rij per kant, nieuwste score links; oudere scores vervagen */
      const mine=st.entries.filter(e=>e.side===side).slice(-4).reverse();
      let chips=mine.map((e,k)=>{const v=e.s===DOOD?'0':String(e.s);return '<button class="chip a'+k+(e.bust?' bust':'')+(e.out?' out':'')+(ed&&ed.turn===e.i?' ed':'')+'" data-a="chip" data-i="'+e.i+'" aria-label="Corrigeer deze score"><span class="cv d'+v.length+'">'+v+'</span>'+(e.bust?'<small>DOOD</small>':'')+'</button>'}).join('');
      for(let k=mine.length;k<4;k++)chips+='<span class="chip empty"></span>';
      h+='<li class="pl'+(on?' on':'')+'"><span class="nm"><b class="newest">◀ nieuwste</b> eerst · tik om te corrigeren</span><div class="hist">'+chips+'</div></li>';
    }
    h+='</ul></section>';
  });
  const dis=(over&&!ed)||readOnly?' disabled':'';
  let edLbl='';if(ed){const e=st.entries[ed.turn];edLbl='Correctie · was '+(e&&e.s===DOOD?'dood':e?e.s:'')}
  h+='<section class="pad"><div class="disp'+(ed?' edit':'')+'"><span class="lbl">'+(ed?edLbl:'Score')+'</span><span class="buf">'+(S.ui.buf||'<span style="color:var(--line)">0</span>')+'</span></div>'+
    '<div class="kpads"><div class="hot">'+HOTKEYS.map(v=>'<button data-a="hot" data-v="'+v+'"'+dis+'>'+v+'</button>').join('')+'</div>'+
    '<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(d=>'<button data-a="key" data-v="'+d+'"'+dis+'>'+d+'</button>').join('')+
    '<button class="bk" data-a="bk"'+dis+' aria-label="Wissen">⌫</button><button data-a="key" data-v="0"'+dis+'>0</button><button class="ok" data-a="ok"'+dis+'>OK</button></div></div>'+
    '<div class="acts">'+(ed?'<button data-a="canceledit">Annuleer</button>':'<button class="outb" data-a="out"'+(over||readOnly||!canCheckout(st.rem[nx.side])?' disabled':'')+'>Uit</button>')+
    '<button class="dood" data-a="dood"'+dis+'>Dood</button>'+
    '<button data-a="undo"'+(readOnly||(!l.turns.length&&g.legs.length<=1)?' disabled':'')+'>Beurt terug</button></div></section>';
  h+='</div>';
  if(over&&!ed)h+=winDialog(m,g);
  return h;

/* ----- Tac-tic ----- */

function markHTML(n){return MKH(n)}
function vTac(m,g){
  const l=tacLeg(g),w=legsWon(g),over=g.winner===0||g.winner===1;

    h+='<div class="thead"><div class="tscore s0"><span class="h"><span>'+esc(sideLabel(m,g,0))+'</span>'+legPips(w[0],g)+'</span><span class="v"><b>'+closed+'</b><small>van 12 dicht</small></span></div>'+
      '<button class="tscore s1 round" data-a="tround"'+(readOnly||over?' disabled':'')+'><span class="h"><span>Beurt</span></span><span class="v"><b>'+((l.rounds||0)+1)+'</b><small>tik na elke beurt</small></span></button></div>';
  }else
  h+='<div class="thead">'+[0,1].map(s=>{
    const open=TARGETS.filter(t=>(l.marks[s][t]||0)<3).length;
    const sc='<button class="tscore s'+s+'" data-a="pts" data-v="'+s+'"'+(readOnly||over?' disabled':'')+' aria-label="Punten '+esc(sideLabel(m,g,s))+' aanpassen"><span class="h">'+((l.starter||0)===s?'<span class="started">Begon</span>':'')+'<span class="tn">'+esc(sideLabel(m,g,s))+'</span>'+legPips(w[s],g)+'</span><span class="v"><b>'+l.pts[s]+'</b>'+(open?'':'<small>dicht</small>')+'</span></button>';
    return sc;
  }).join('')+'</div>';
  const dis=readOnly||over?' disabled':'';
  h+='<div class="tboard">'+TARGETS.map(t=>{
    const a=l.marks[0][t]||0,b=l.marks[1][t]||0,dead=a>=3&&b>=3;
    return '<div class="trow'+(dead?' dead':'')+'">'+
      '<button class="tminus" data-a="tmin" data-s="0" data-t="'+t+'"'+(dis||!a?' disabled':'')+' aria-label="Kruis weg thuis '+t+'">−</button>'+
      '<button class="tcell s0" data-a="tadd" data-s="0" data-t="'+t+'"'+dis+' aria-label="Kruis erbij thuis '+t+'">'+markHTML(a)+'</button>'+
      '<span class="tnum">'+(t===25?'B':t)+'</span>'+(g.solo?'<span class="tcell s1 off"></span><span></span></div>':
      '<button class="tcell s1" data-a="tadd" data-s="1" data-t="'+t+'"'+dis+' aria-label="Kruis erbij gast '+t+'">'+markHTML(b)+'</button>'+
      '<button class="tminus" data-a="tmin" data-s="1" data-t="'+t+'"'+(dis||!b?' disabled':'')+' aria-label="Kruis weg gast '+t+'">−</button></div>');
  }).join('')+'</div>';
  const v=over?null:(g.solo?(closedAll(l.marks[0])?{solo:true}:null):tacVerdict(l));
  h+='<div class="tfoot">';
  if(v&&v.solo)h+='<div class="banner"><span>Alles dicht in '+((l.rounds||0)+1)+' beurten.</span><button class="btn primary" data-a="tsolodone"'+(readOnly?' disabled':'')+'>Leg afronden</button></div>';
  else if(g.solo)h+='<span class="hint">Tik naast een getal voor elk raak. Tik rechtsboven op Beurt na elke drie pijlen, zo zie je hoeveel beurten je nodig hebt.</span>';
  else if(v&&v.win!=null)h+='<div class="banner"><span>'+esc(sideLabel(m,g,v.win))+' heeft alles dicht en meer punten.</span><button class="btn primary" data-a="tawardleg" data-v="'+v.win+'"'+(readOnly?' disabled':'')+'>Leg naar '+esc(sideLabel(m,g,v.win))+'</button></div>';
  else if(v&&v.replay)h+='<div class="banner"><span>Alles dicht en gelijk in punten: leg overgooien.</span><button class="btn primary" data-a="treplay"'+(readOnly?' disabled':'')+'>Leg opnieuw</button></div>';
  else h+='<span class="hint">Tik naast een getal voor een kruis. Op een gesloten getal telt een tik de punten erbij. Tik op een score om punten aan te passen.</span>';
  h+='<button class="btn" data-a="tundo"'+(readOnly||!(S.tundo&&S.tundo.length)?' disabled':'')+'>Ongedaan maken</button></div>';
  h+='</div>';
  if(S.ui.ptsFor!=null&&!over)h+=ptsDialog(m,g,l);
  if(over)h+=winDialog(m,g);
  return h;
}
function ptsDialog(m,g,l){
  const s=S.ui.ptsFor,buf=S.ui.pbuf||'';
  return '<div class="cover"><div class="dialog"><span class="meta">Punten '+esc(sideLabel(m,g,s))+'</span><h3 class="c'+s+'">'+l.pts[s]+'</h3>'+
  '<div class="disp"><span class="lbl">Aantal</span><span class="buf">'+(buf||'<span style="color:var(--line)">0</span>')+'</span></div>'+

  '<div class="ptsops"><button class="add" data-a="pop" data-v="add">+ Erbij</button><button data-a="pop" data-v="sub">− Eraf</button><button data-a="pop" data-v="set">= Vervang</button></div></div></div>';

/* ================= acties ================= */
function startLos(l){
  const solo=l.size===0;
  S.losLast=clone(l);
  const g={n:1,block:0,kind:l.kind,size:solo?1:l.size,solo,bestOf:l.bo||3,home:l.home.slice(0,solo?1:l.size).map(x=>(x||'').trim()),away:solo?[]:l.away.slice(0,l.size).map(x=>(x||'').trim()),legs:[],winner:null};
  const m={id:uid(),kind:'los',type:'Los',teamName:'',opponent:'',date:today(),createdAt:Date.now(),status:'open',games:[g]};
  persist('matches',m);go('partij-'+m.id+'-1');
}
function endLos(m,g){
  if(m.kind!=='los'||(g.winner!==0&&g.winner!==1))return false;
  S.ui.losCache=clone(m);removeDoc('matches',m.id);return true;
}
function afterX01(m,g,res){
  if(!endLos(m,g))persist('matches',m,g.n);
  if(res&&res.leg!=null)toast('Leg voor '+sideLabel(m,g,res.leg)+'. Nieuwe leg.');
  render();
}
function commitX01(s){
  const {m,g}=curGame();if(!m||!g||readOnly)return;
  if(!g.legs.length)g.legs=[{starter:0,turns:[]}];
  const l=g.legs[g.legs.length-1],st=x01State(g,l),ed=S.ui.edit;
  if(ed){
    const e=st.entries[ed.turn];if(!e){S.ui.edit=null;render();return}
    const err=validX01(s,e.before);if(err){toast(err);return}
    l.turns[ed.turn]=s;S.ui.edit=null;
  }else{
    if(g.winner!=null)return;
    const before=st.rem[st.next.side],err=validX01(s,before);if(err){toast(err);S.ui.buf='';render();return}
    l.turns.push(s);
    if(s!==DOOD){const r=before-s;if(r<0||r===1)toast('Dood: score telt niet.')}
  }
  S.ui.buf='';afterX01(m,g,normalizeX01(g));
}
function undoX01(){
  const {m,g}=curGame();if(!m||!g||readOnly)return;
  S.ui.edit=null;S.ui.buf='';
  const l=g.legs[g.legs.length-1];if(!l)return;
  if(g.winner!=null){g.winner=null;l.turns.pop()}
  else if(!l.turns.length){if(g.legs.length>1){g.legs.pop();g.legs[g.legs.length-1].turns.pop()}else return}
  else l.turns.pop();
  persist('matches',m,g.n);toast('Beurt teruggedraaid.');render();
}
/* tac-tic acties: elke wijziging bewaart eerst een kopie voor 'ongedaan maken' */
function tacEdit(fn){
  const {m,g}=curGame();if(!m||!g||readOnly)return;
  S.tundo=S.tundo||[];S.tundo.push(clone({legs:g.legs,winner:g.winner}));if(S.tundo.length>60)S.tundo.shift();
  if(!g.legs.length)g.legs.push(newTacLeg());
  const l=g.legs[g.legs.length-1];
  const msg=fn(g,l,m);
  if(!endLos(m,g))persist('matches',m,g.n);if(msg)toast(msg);render();
}
function tacAward(g,l,s){
  l.winner=s;const w=legsWon(g);
  if(w[s]>=need(g)){g.winner=s;return null}
  g.legs.push(newTacLeg(1-(l.starter||0)));return 'Leg gewonnen. Nieuwe leg.';
}
function manageWake(){
  const want=S.gate==='ok'&&document.visibilityState==='visible';
  if(want&&!wakeLock&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>{wakeLock=w;w.addEventListener('release',()=>{wakeLock=null})}).catch(()=>{})}
  if(!want&&wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){manageWake();if(S.gate==='ok'&&typeof verifyDevice==='function')verifyDevice();if(S.route&&S.route.name==='home')checkVersion(true)}});

/* snelle invoer overal: knoppen reageren bij het loslaten van de vinger (scorebord al bij neerdrukken),
   ook als het scherm tussen twee tikken opnieuw is opgebouwd. Scrollen annuleert de tik. */
let downEl=null,downX=0,downY=0,holdT=null,holdFired=false;
function activate(el){
  if(!el||el.disabled)return;
  if(el.hasAttribute('data-a'))act(el);
  else if(el.hasAttribute('data-go'))go(el.getAttribute('data-go'));
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  downEl=null;holdFired=false;clearTimeout(holdT);
  const el=e.target.closest('[data-a],[data-go]');
  if(el&&!el.disabled&&el.hasAttribute('data-a')&&el.closest('.game')&&el.dataset.a!=='fs'){e.preventDefault();act(el);return}
  if(el&&!el.disabled)downEl=el;
  downX=e.clientX;downY=e.clientY;
  /* titel ingedrukt houden: beheer-apparaat 2 s naar Beheer; ander apparaat 6 s naar het beheercode-scherm
     (werkt ook in de app op het beginscherm, waar je geen adres kunt intypen) */
  if(e.target.closest('.brand')){holdT=setTimeout(()=>{holdFired=true;downEl=null;go('beheer')},S.isAdmin?2000:6000);return}
  const card=e.target.closest('[data-hold]');
  if(card&&!readOnly&&(!el||el===card)){
    const id=card.dataset.hold;
    holdT=setTimeout(()=>{holdFired=true;downEl=null;S.ui.delAsk=id;render();if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}},600);
  }
});
document.addEventListener('pointermove',e=>{if((downEl||holdT)&&Math.hypot(e.clientX-downX,e.clientY-downY)>10){downEl=null;clearTimeout(holdT)}});
document.addEventListener('pointercancel',()=>{downEl=null;clearTimeout(holdT)});
document.addEventListener('pointerup',e=>{
  clearTimeout(holdT);
  if(holdFired||!downEl)return;
  const el=downEl;downEl=null;activate(el);
});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hold]')||e.target.closest('.game'))e.preventDefault()});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a],[data-go]');
  if(!el)return;
  e.preventDefault();
  if(e.detail>0)return; /* tik/klik al afgehandeld via pointer-events */
  activate(el); /* toetsenbord (Enter/spatie) */
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-go]')){e.preventDefault();activate(e.target)}
});
function act(el){
  const a=el.dataset.a,v=el.dataset.v;
  if(a!=='confirm')S.ui.confirm=null;
  switch(a){
    case 'confirm':{
      if(S.ui.confirm!==el.dataset.k){S.ui.confirm=el.dataset.k;render();return}
      S.ui.confirm=null;
      if(el.dataset.do==='clearsched'){S.ui.draft.schedule=[];S.ui.draft.scheduleNote='';toast('Schema gewist. Vergeet niet op te slaan.');render();return}
      if(el.dataset.do==='delteam'){removeDoc('teams',S.ui.draft.id);toast('Team naar de prullenbak verplaatst.');go('')}
      if(el.dataset.do==='season'){closeSeason();return}
      {const [k,a,b]=el.dataset.do.split(':');
       if(k==='unlink'||k==='unadmin'){adminAction(k,a);return}
       if(k==='purge'){purgeDoc(a,b);return}}
      if(el.dataset.do==='delmatch'){const dm=S.matches[S.route.id];removeDoc('matches',S.route.id);toast('Naar de prullenbak verplaatst.');go(dm&&S.teams[dm.teamId]?'team-'+dm.teamId:'')}
      return;
    }
    case 'addplayer':S.ui.draft.players.push({id:uid(),name:'',nr:'',role:''});S.ui.focus='#p-n-'+(S.ui.draft.players.length-1);render();return;
    case 'delplayer':S.ui.draft.players.splice(+el.dataset.i,1);render();return;
    case 'addsched':S.ui.draft.schedule.push({id:uid(),date:today(),type:'Divisie',round:'',venue:'Thuis',opponent:'',address:''});render();return;
    case 'showall':S.ui.showAll=S.ui.showAll||{};S.ui.showAll[v]=!S.ui.showAll[v];render();return;
    case 'delsched':S.ui.draft.schedule.splice(+el.dataset.i,1);render();return;
    case 'saveteam':case 'saveteamstart':{
      const d=S.ui.draft;d.name=(d.name||'').trim();
      if(!d.name){toast('Geef het team een naam.');S.ui.focus='#t-name';render();return}
      d.players=d.players.filter(p=>(p.name||'').trim()).map(p=>({...p,name:p.name.trim(),nr:String(p.nr||'').replace(/\D/g,'').slice(0,4)}));
      if(S.isAdmin)d.schedule.sort((x,y)=>(x.date||'').localeCompare(y.date||''));
      persist('teams',clone(d));toast('Team opgeslagen.');S.ui.draftFor=null;
      if(a==='saveteamstart')go('start-'+d.id);else go('team-'+d.id);
      return;
    }
    case 'pick':{const s=(S.teams[S.route.id].schedule||[]).find(x=>x.id===v);if(s)S.ui.start={type:s.type,opponent:s.type==='Divisie'?s.opponent||'':'',date:s.date,round:s.round||'',venue:s.venue||'',from:s.id};render();return}
    case 'stype':S.ui.start.type=v;if(v!=='Divisie'){S.ui.start.round='';S.ui.start.venue=''}render();return;
    case 'startnight':{const t=S.teams[el.dataset.id];if(!t)return;S.ui.start.type=v;const m=newNight(t,S.ui.start);persist('matches',m);go('avond-'+m.id);return}
    case 'finish':{const m=S.matches[S.route.id];m.status='klaar';m.autoKlaar=false;persist('matches',m,-1);toast('Speelavond afgerond.');render();return}
    case 'reopen':{const m=S.matches[S.route.id];m.status='open';persist('matches',m,-1);render();return}
    case 'lkind':S.ui.los.kind=v;render();return;
    case 'lsize':{const was=S.ui.los.size;S.ui.los.size=+v;if((was===0)!==(+v===0))S.ui.los.bo=3;render();return}
    case 'guide':S.ui.guide={id:v,step:0};render();return;
    case 'gnext':S.ui.guide.step++;render();return;
    case 'gprev':if(S.ui.guide.step>0)S.ui.guide.step--;render();return;
    case 'gclose':S.ui.guide=null;render();return;
    case 'gtry':S.losPreset=v;go('los');return;
    case 'lbo':S.ui.los.bo=+v;render();return;
    case 'startlos':startLos(S.ui.los);return;
    case 'losagain':{ /* exact dezelfde oefenpartij opnieuw starten */
      const {m}=curGame();const g=m&&m.games[0];if(!g)return;
      startLos({kind:g.kind,size:g.solo?0:g.size,bo:g.bestOf||3,home:(g.home||[]).concat(['','']).slice(0,2),away:(g.away||[]).concat(['','']).slice(0,2)});return;
    }
    case 'fs':{const d=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(d.requestFullscreen)d.requestFullscreen().catch(()=>toast('Volledig scherm is hier niet beschikbaar.'));else toast('Volledig scherm is hier niet beschikbaar.')}catch(err){toast('Volledig scherm is hier niet beschikbaar.')}return}
    /* 501/701 */
    case 'starter':{const {m,g}=curGame();g.legs=[{starter:+v,turns:[]}];g.winner=null;persist('matches',m,g.n);render();return}
    case 'swapstart':{const {m,g}=curGame();if(!g.legs.length)g.legs=[{starter:0,turns:[]}];const l=g.legs[g.legs.length-1];if(!l.turns.length){l.starter=1-l.starter;persist('matches',m,g.n);render()}return}
    case 'key':if((S.ui.buf||'').length<3){S.ui.buf=(S.ui.buf==='0'?'':S.ui.buf||'')+v;render()}return;
    case 'bk':S.ui.buf=(S.ui.buf||'').slice(0,-1);render();return;
    case 'ok':if(!S.ui.buf){toast('Tik eerst een score in (0 voor geen punten).');return}commitX01(+S.ui.buf);return;
    case 'hot':commitX01(+v);return;
    case 'dood':commitX01(DOOD);return;
    case 'out':{const {g}=curGame();const st=x01State(g,g.legs[g.legs.length-1]);commitX01(st.rem[st.next.side]);return}
    case 'undo':{const {g}=curGame();if(g&&g.kind==='tactic'){tacUndo();return}undoX01();return}
    case 'chip':if(readOnly)return;S.ui.edit={turn:+el.dataset.i};S.ui.buf='';render();return;
    case 'canceledit':S.ui.edit=null;S.ui.buf='';render();return;
    /* tac-tic */
    case 'tadd':{const s=+el.dataset.s,t=+el.dataset.t;tacEdit((g,l)=>{
      const o=1-s;
      if((l.marks[s][t]||0)<3){l.marks[s][t]=(l.marks[s][t]||0)+1;return null}
      if(g.solo){S.tundo.pop();return (t===25?'Bull':t)+' is al dicht.'}
      if((l.marks[o][t]||0)>=3){S.tundo.pop();return 'Beide kanten hebben '+(t===25?'bull':t)+' dicht.'}
      l.pts[s]+=t;return '+'+t+' punten';
    });return}
    case 'tround':tacEdit((g,l)=>{l.rounds=(l.rounds||0)+1;return null});return;
    case 'tsolodone':tacEdit((g,l)=>{l.rounds=(l.rounds||0)+1;return tacAward(g,l,0)});return;
    case 'bosave':saveBo(false);return;
    case 'boreset':saveBo(true);return;
    case 'tmin':{const s=+el.dataset.s,t=+el.dataset.t;tacEdit((g,l)=>{if((l.marks[s][t]||0)>0)l.marks[s][t]--;return null});return}
    case 'pts':S.ui.ptsFor=+v;S.ui.pbuf='';render();return;
    case 'pkey':if((S.ui.pbuf||'').length<4){S.ui.pbuf=((S.ui.pbuf==='0'?'':S.ui.pbuf)||'')+v;render()}return;
    case 'pbk':S.ui.pbuf=(S.ui.pbuf||'').slice(0,-1);render();return;
    case 'pclose':S.ui.ptsFor=null;S.ui.pbuf='';render();return;
    case 'pop':{const s=S.ui.ptsFor,n=+(S.ui.pbuf||0);
      if(v!=='set'&&!n){toast('Tik eerst een aantal punten in.');return}
      S.ui.ptsFor=null;S.ui.pbuf='';
      tacEdit((g,l)=>{if(v==='add')l.pts[s]+=n;else if(v==='sub')l.pts[s]=Math.max(0,l.pts[s]-n);else l.pts[s]=n;return null});return}
    case 'tawardleg':tacEdit((g,l)=>tacAward(g,l,+v));return;
    case 'treplay':tacEdit((g,l)=>{const nl=newTacLeg();l.marks=nl.marks;l.pts=nl.pts;l.replays=(l.replays||0)+1;return 'Leg wordt overgegooid.'});return;
    case 'tundo':tacUndo();return;
    case 'tstarter':tacEdit((g,l)=>{l.starter=1-(l.starter||0);return null});return;
    case 'resnew':openResult(S.teams[v],null,null);render();return;
    case 'resfor':{const t=S.teams[S.route.id];const s=(t.schedule||[]).find(x=>x.id===v);openResult(t,s,null);render();return}
    case 'resedit':openResult(null,null,S.matches[S.route.id]);render();return;
    case 'resset':S.ui.res[el.dataset.k]=v;render();return;
    case 'rescancel':S.ui.res=null;render();return;
    case 'ressave':saveResult();return;
    case 'editnight':{const m=S.matches[S.route.id]||S.archived[S.route.id];if(m)S.ui.editNight={opponent:m.opponent||'',date:m.date||'',round:m.round||'',venue:m.venue||'',type:m.type};render();return}
    case 'enset':S.ui.editNight.venue=v;render();return;
    case 'encancel':S.ui.editNight=null;render();return;
    case 'ensave':{const m=S.matches[S.route.id]||S.archived[S.route.id],e=S.ui.editNight;if(!m||!e)return;
      if(!e.date){toast('Vul de datum in.');return}
      m.opponent=(e.opponent||'').trim()||m.opponent;m.date=e.date;if(m.type==='Divisie'){m.round=String(e.round||'').replace(/\D/g,'');m.venue=e.venue}
      S.ui.editNight=null;persist('matches',m,-1);toast('Gegevens aangepast.');render();return}
    case 'sethf':setDoc(doc(fs,'settings','format'),{hf:+v,updatedAt:Date.now()},{merge:true}).then(()=>toast('High finish vanaf '+v+'.'),()=>toast('Opslaan lukte niet.'));S.settings=Object.assign({},S.settings||{},{hf:+v});render();return;
    case 'openseason':S.ui.openSeason=S.ui.openSeason===v?null:v;render();return;
    case 'restore':restoreDoc(el.dataset.k,v);return;
    case 'appupdate':applyUpdate();return;
    case 'delheld':{const id=S.ui.delAsk;S.ui.delAsk=null;if(id){removeDoc('matches',id);toast('Naar de prullenbak verplaatst.')}render();return}
    case 'delcancel':S.ui.delAsk=null;render();return;
  }
}
function tacUndo(){
  const {m,g}=curGame();if(!m||!g||readOnly)return;
  if(!S.tundo||!S.tundo.length){toast('Niets om ongedaan te maken op deze tablet.');return}
  const prev=S.tundo.pop();g.legs=prev.legs;g.winner=prev.winner;persist('matches',m,g.n);render();
}
document.addEventListener('input',e=>{

  if(ds.seasonname){S.ui.season=t.value;return}

  if(ds.f&&S.ui.draft){S.ui.draft[ds.f]=t.value;return}
  if(ds.pf&&S.ui.draft){const p=S.ui.draft.players[+ds.p];if(!p)return;
    if(ds.pf==='role'){if(t.value)S.ui.draft.players.forEach(q=>{if(q!==p&&q.role===t.value)q.role=''});p.role=t.value;render();return}
    if(ds.pf==='nr'){p.nr=t.value.replace(/\D/g,'').slice(0,4);t.value=p.nr;return}
    p[ds.pf]=t.value;return}
  if(ds.sf&&S.ui.draft){const s=S.ui.draft.schedule[+ds.s];if(s){s[ds.sf]=ds.sf==='round'?t.value.replace(/\D/g,''):t.value;if(ds.sf==='round')t.value=s.round;if(ds.sf==='type')render()}return}
  if(ds.st&&S.ui.start){S.ui.start[ds.st]=t.value;return}
  if(ds.lh!=null&&S.ui.los){S.ui.los.home[+ds.lh]=t.value;return}
  if(ds.la!=null&&S.ui.los){S.ui.los.away[+ds.la]=t.value;return}
});
document.addEventListener('keydown',e=>{
  if(!S.route||S.route.name!=='partij')return;
  if(e.target.closest('input,select,textarea'))return;
  const {g}=curGame();if(!g||g.kind==='tactic')return;
  if(/^[0-9]$/.test(e.key)){if((S.ui.buf||'').length<3){S.ui.buf=(S.ui.buf==='0'?'':S.ui.buf||'')+e.key;render()}e.preventDefault()}
  else if(e.key==='Backspace'){S.ui.buf=(S.ui.buf||'').slice(0,-1);render();e.preventDefault()}
  else if(e.key==='Enter'){if(S.ui.buf)commitX01(+S.ui.buf);e.preventDefault()}
  else if(e.key==='Escape'&&S.ui.edit){S.ui.edit=null;S.ui.buf='';render()}

function makeDb(){

/* Speelschema's die Claude via GitHub meelevert (schedules.json) worden één keer in het team gezet.
   Daarna bewerkt de club het schema gewoon in de app; een nieuwe versie overschrijft het weer. */
async function applySchedules(){
  try{
    const r=await fetch('schedules.json',{cache:'no-store'});if(!r.ok)return;
    const list=await r.json();if(!Array.isArray(list)||!list.length)return;
    const snap=await getDocsFromServer(collection(fs,'teams'));
    const teams=snap.docs.map(d=>({id:d.id,...d.data()}));
    for(const e of list){
      const t=teams.find(x=>x.id===e.teamId)||teams.find(x=>(x.name||'').toLowerCase()===(e.team||'').toLowerCase());
      if(!t||t.scheduleVersion===e.version)continue;
      await setDoc(doc(fs,'teams',t.id),{schedule:e.schedule,scheduleNote:e.scheduleNote||'',scheduleVersion:e.version,rev:(t.rev||0)+1,updatedAt:Date.now()},{merge:true});
    }
  }catch(err){}
}

}

let matchUnsub=null,matchKey='';
function subMatches(){
  if(!db)return;
  const r=S.route||{},one=r.name==='partij'||r.name==='avond';
  const local=one&&((S.matches[r.id]&&S.matches[r.id].kind==='los')||(S.ui.losCache&&S.ui.losCache.id===r.id));
  const key=local?'local':one?'doc:'+r.id:'coll';
  if(key===matchKey)return;
  matchKey=key;if(matchUnsub){matchUnsub();matchUnsub=null}
  if(local)return; /* oefenpartij: niets online te volgen */
  if(!one){
    firstSnap.matches=true;
    matchUnsub=onSnapshot(query(collection(fs,'matches'),orderBy('createdAt','desc'),limit(400)),q=>mergeSnap('matches',wrap(q)),()=>{setSync('fout');verifyDevice()});
    return;
  }
  const id=r.id,p='matches/'+id;
  matchUnsub=onSnapshot(doc(fs,'matches',id),d=>{
    if(!d.exists()){if(!pend[p]&&!busy[p]&&!(S.ui.losCache&&S.ui.losCache.id===id))place('matches',id,null)}
    else{const v=fromRemote('matches',d.data()),loc=findAny('matches',id);if(!loc||(v.rev||0)>=(loc.rev||0))place('matches',id,clone(v))}
    lsSave();render();
  },()=>{setSync('fout');verifyDevice()});
}

async function closeSeason(){
  const season=(S.ui.season||'').trim()||seasonGuess();

      const o=clone(t);o.archive=o.archive||{};o.archive[season]={schedule:o.schedule||[],scheduleNote:o.scheduleNote||''};

function unlinkHere(){

  if(!u){signInAnonymously(auth).catch(()=>{S.gate='nodig';S.gateErr='Geen verbinding met de server. Controleer het internet en herlaad de app.';render()});return}
  fbUid=u.uid;

});
