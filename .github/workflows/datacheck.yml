name: Gegevenscontrole (tijdelijk, alleen lezen)
on:
  push:
    branches: [keycheck]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wijzigingen van vandaag in de echte gegevens
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARTSCLUB_LENTJHEUVEL }}
        run: |
          npm install --no-save --no-audit --no-fund firebase-admin@12 >/dev/null
          cat > c.mjs <<'JS'
          import {initializeApp, cert} from 'firebase-admin/app';
          import {getFirestore} from 'firebase-admin/firestore';
          initializeApp({credential: cert(JSON.parse(process.env.SA))});
          const db = getFirestore();
          const since = Date.parse('2026-10-31T23:00:00Z');
          for (const c of ['matches','teams','settings']) {
            const s = await db.collection(c).get();
            for (const d of s.docs) {
              const v = d.data();
              const ts = Math.max(v.updatedAt||0, v.createdAt||0);
              if (ts < since) continue;
              const games = v.gm ? Object.values(v.gm) : (v.games||[]);
              const played = games.filter(g => g && g.legs && g.legs.length).length;
              const info = c==='matches' ? `${v.kind} ${v.teamName||''} vs ${v.opponent||''} datum=${v.date} status=${v.status} gespeeld=${played} aangemaakt=${new Date(v.createdAt||0).toISOString()} gewijzigd=${new Date(v.updatedAt||0).toISOString()}${v.deleted?' (in prullenbak)':''}${v.manual?' (ingevoerd)':''}`
                : `${v.name||d.id} gewijzigd=${new Date(v.updatedAt||0).toISOString()}`;
              console.log(`::notice title=${c}/${d.id}::${info}`);
            }
          }
          JS
          node c.mjs
