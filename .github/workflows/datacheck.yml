name: Testavond naar prullenbak (tijdelijk)
on:
  push:
    branches: [keycheck]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wijzigingen van vandaag in de echte gegevens
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARTSCLUB_LENTJHEUVEL }}
        run: |
          npm install --no-save --no-audit --no-fund firebase-admin@12 >/dev/null
          cat > c.mjs <<'JS'
          import {initializeApp, cert} from 'firebase-admin/app';
          import {getFirestore} from 'firebase-admin/firestore';
          initializeApp({credential: cert(JSON.parse(process.env.SA))});
          const db = getFirestore();
          const ref = db.collection('matches').doc('mvvmq6f7kisam9');
          const d = await ref.get();
          const v = d.data();
          if (!d.exists || v.teamName !== 'Lentjheuvel 4' || v.date !== '2026-11-06' || v.deleted) { console.log('::error title=Gestopt::document niet zoals verwacht'); process.exit(1); }
          await ref.update({deleted: {at: Date.now(), by: 'Claude (testavond opgeruimd)'}, rev: (v.rev||0) + 1, updatedAt: Date.now()});
          console.log('::notice title=Klaar::testavond Lentjheuvel 4 vs Treebeekse Treffers 3 (6 nov) naar de prullenbak verplaatst');
          JS
          node c.mjs
